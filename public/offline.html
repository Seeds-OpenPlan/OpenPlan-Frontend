<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenPlan — 오프라인</title>
    <!--
      서비스워커(sw.js)가 네트워크 내비게이션 실패 시 보여주는 폴백 페이지.
      외부 리소스(폰트/CDN/이미지 등)를 전혀 쓰지 않는다 — 오프라인 상태에서
      로드되는 페이지이므로 외부 요청이 하나라도 있으면 그마저 실패해
      빈 화면이 될 수 있다. 그래서 스타일도 인라인으로 전부 넣는다.
    -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          '맑은 고딕',
          sans-serif;
        background-color: #ffffff;
        color: #0f172a;
      }
      .wrap {
        max-width: 320px;
        padding: 24px;
        text-align: center;
      }
      .title {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 700;
      }
      .desc {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.5;
        color: #475569;
      }
      .retry {
        /* 44px 이상 터치 타겟 — 모바일/TWA 환경에서 손가락으로 누르는 버튼. */
        min-height: 44px;
        padding: 0 20px;
        border: none;
        border-radius: 8px;
        background-color: #2563eb;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .retry:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="title">오프라인 상태입니다</p>
      <p class="desc">연결을 확인한 뒤 다시 시도해 주세요.</p>
      <button type="button" class="retry" onclick="location.reload()">다시 시도</button>
    </div>
  </body>
</html>
